[project]
name = "kicker-manager-analysis"
version = "0.1.0"
description = "Optimal squad selection for the kicker-Managerspiel Classic (Bundesliga)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.17",
    "pulp>=2.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = [
    "marimo>=0.10",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicker_manager_analysis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# marimo stores notebooks as plain modules: cells are undocumented functions whose trailing
# bare expression is the rendered output, and marimo rewrites their signatures on save.
"notebooks/*.py" = ["B018", "D100", "D103", "F811"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pulp.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
